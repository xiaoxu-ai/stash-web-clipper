<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    /* 配色跟着图标 P6 走：纸白米黄底 + 麂皮驼袋身 + 赭石包边。
       主色用赭石（深的那个），因为它要当按钮底色托白字。
       --warn 单独用红系，别跟褐色主色混在一起，否则报错看着像正常状态。 */
    :root {
      --paper: #FAF7F0; --paper-2: #F1ECE0;
      --ink: #1B1C20; --muted: #6A665E; --rule: #E2DACA;
      --accent: #8B4A26; --accent-2: #6E3819; --warn: #B3261E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #1A1714; --paper-2: #241F1A;
        --ink: #EDE5D7; --muted: #A09687; --rule: #3A322A;
        --accent: #C9925B; --accent-2: #DCAC7B; --warn: #F0736A;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 330px; margin: 0; padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      font-size: 14px; color: var(--ink); background: var(--paper);
    }
    header { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
    header img { width: 26px; height: 26px; border-radius: 6px; }
    header .name { font-size: 15px; font-weight: 650; }
    header .sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

    .status {
      background: var(--paper-2); border-radius: 9px; padding: 11px 12px;
      color: var(--muted); line-height: 1.5; font-size: 13px;
      margin-bottom: 10px; word-break: break-word;
    }
    .status.err { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); }
    .status.ok  { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent); }

    .bar { height: 5px; background: var(--rule); border-radius: 3px; overflow: hidden; margin-bottom: 10px; display: none; }
    .bar.on { display: block; }
    .bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .3s; }
    .bar.indet > i { width: 35%; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }

    /* 提取到的文章：标题 + 字数图数，够确认「抓对了没」 */
    .card {
      display: none; margin-bottom: 12px; padding: 11px 12px;
      background: var(--paper-2); border: 1px solid var(--rule); border-radius: 9px;
    }
    .card.on { display: block; }
    .card .ttl { font-size: 13px; font-weight: 650; line-height: 1.45; margin-bottom: 5px; }
    .card .meta { font-size: 11.5px; color: var(--muted); }
    .card .meta a { color: var(--accent); text-decoration: none; }
    .card .meta a:hover { text-decoration: underline; }
    .card .warn {
      margin-top: 8px; padding: 7px 9px; border-radius: 6px;
      font-size: 11.5px; line-height: 1.5;
      background: color-mix(in srgb, var(--warn) 13%, transparent); color: var(--warn);
    }

    button {
      width: 100%; padding: 11px; border: 1.5px solid var(--accent); border-radius: 8px;
      background: var(--accent); color: var(--paper);
      font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
      margin-bottom: 8px;
    }
    button:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
    button:disabled { opacity: .4; cursor: default; }
    button.ghost { background: transparent; color: var(--accent); }
    button.ghost:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 10%, transparent); }

    .hint { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin: 2px 0 8px; }

    footer { margin-top: 4px; display: flex; justify-content: space-between; align-items: center; }
    a.link { color: var(--muted); font-size: 12px; text-decoration: none; cursor: pointer; }
    a.link:hover { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" />
    <div>
      <div class="name">文章打包</div>
      <div class="sub">任何网页长文 → Markdown / 单文件 HTML</div>
    </div>
  </header>

  <div id="status" class="status">在任意文章页点下面的按钮。</div>
  <div id="bar" class="bar"><i id="barFill"></i></div>

  <div id="card" class="card">
    <div class="ttl" id="cardTitle"></div>
    <div class="meta" id="cardMeta"></div>
  </div>

  <button id="btnExtract">提取本页文章</button>
  <button id="btnMd" class="ghost" disabled>下载 Markdown + 图片</button>
  <button id="btnHtml" class="ghost" disabled>下载 HTML（单文件，图片内嵌）</button>

  <div class="hint" id="hint">下载在后台跑，这个窗口可以随手关掉。</div>

  <footer>
    <a class="link" id="linkCopy">复制 Markdown</a>
    <a class="link" id="linkClear">清除</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
