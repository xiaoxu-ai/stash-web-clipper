<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 落选方案：纸白米黄底 + 朱红口袋 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F2E7"/>
      <stop offset="1" stop-color="#EDE6D6"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="29" fill="url(#bg)"/>
  <rect x="1.75" y="1.75" width="124.5" height="124.5" rx="27.25" fill="none" stroke="#1B1C20" stroke-opacity="0.14" stroke-width="3.5"/>

  <!-- 露在外面的纸：向左歪 11°，右上角折起 -->
  <g transform="rotate(-11 59 52)">
    <path d="M36 21 h34 l18 18 v38 a6 6 0 0 1-6 6 H36 a6 6 0 0 1-6-6 V27 a6 6 0 0 1 6-6 Z"
          fill="#FFFDF8" stroke="#1B1C20" stroke-opacity="0.18" stroke-width="2.5"/>
    <path d="M70 21 v10 a8 8 0 0 0 8 8 h10 Z" fill="#DCD4C2"/>
    <rect x="42" y="43" width="34" height="6" rx="3" fill="#1B1C20" opacity=".78"/>
    <rect x="42" y="54" width="34" height="6" rx="3" fill="#1B1C20" opacity=".5"/>
    <rect x="42" y="65" width="22" height="6" rx="3" fill="#1B1C20" opacity=".3"/>
  </g>

  <!-- 斜插口袋：四角 r=9（小于外框 r=29）。顶边是斜的，圆角切点为手算 -->
  <path d="M25.75 71.89 L99.25 54.12 A9 9 0 0 1 108 61 L108 101
           A9 9 0 0 1 99 110 L26 110 A9 9 0 0 1 17 101 L17 83
           A9 9 0 0 1 25.75 71.89 Z" fill="#E5322D"/>
  <!-- 袋口厚度：与顶边平行下移 13 -->
  <path d="M25.75 71.89 L99.25 54.12 A9 9 0 0 1 108 61 L108 65 L17 87 L17 83
           A9 9 0 0 1 25.75 71.89 Z" fill="#F2665F"/>
</svg>
